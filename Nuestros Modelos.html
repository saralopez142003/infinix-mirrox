<html>
<head>
<style>

body{
    margin:0;
    padding:30px;
    font-family: Arial, sans-serif;
    background:#f4f8fc;
}

h1{
    text-align:center;
    color:#1e40af;
    margin-bottom:40px;
}

.galeria{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

.tarjeta{
    background:white;
    width:280px;
    padding:15px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,0.15);
    text-align:center;
}

.tarjeta img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:8px;
}

.tarjeta h3{
    color:#1e40af;
}

.tarjeta p{
    color:#666;
}

</style>
</head>

<body>

<h1>NUESTROS MODELOS</h1>

<div class="galeria">

    <div class="tarjeta">
        <img src="imagen1.jpg" alt="Modelo Violeta">
        <h3>Modelo Violeta</h3>
        <p>Diseño moderno con iluminación LED personalizada.</p>
    </div>

    <div class="tarjeta">
        <img src="imagen2.jpg" alt="Modelo Dorado">
        <h3>Modelo Dorado</h3>
        <p>Elegancia y profundidad visual para cualquier espacio.</p>
    </div>

    <div class="tarjeta">
        <img src="imagen3.jpg" alt="Modelo Verde">
        <h3>Modelo Verde</h3>
        <p>Un toque único para habitaciones y zonas gaming.</p>
    </div>

</div>

</body>
</html>
